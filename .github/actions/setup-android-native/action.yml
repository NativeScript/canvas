name: Setup Android native build environment
description: >
  Installs JDK 17 (with gradle cache), the Android SDK + NDK, and optionally
  the Rust nightly toolchain. Exports the NDK/cargo-linker environment that
  tools/scripts/build-android.sh and build-svg-android.sh expect.

inputs:
  ndk-version:
    description: NDK version to install via sdkmanager (must match ndkVersion in canvas build.gradle and the default in tools/scripts/build-android.sh)
    required: false
    default: '29.0.14206865'
  api-level:
    description: Android API level used for the NDK clang wrappers
    required: false
    default: '21'
  install-rust:
    description: Install Rust nightly + cargo cache (set 'false' for gradle-only projects)
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup NDK
      shell: bash
      run: |
        set -e
        (yes || true) | sdkmanager "ndk;${{ inputs.ndk-version }}" > /dev/null
        NDK="$ANDROID_HOME/ndk/${{ inputs.ndk-version }}"
        TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
        API=${{ inputs.api-level }}
        {
          echo "NDK=$NDK"
          echo "NDK_PATH=$NDK"
          echo "ANDROID_NDK=$NDK"
          echo "ANDROID_NDK_HOME=$NDK"
          echo "ANDROID_NDK_ROOT=$NDK"
          echo "NDK_HOST=linux-x86_64"
          echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=$TOOLCHAIN/bin/armv7a-linux-androideabi${API}-clang"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/aarch64-linux-android${API}-clang"
          echo "CARGO_TARGET_I686_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/i686-linux-android${API}-clang"
          echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$TOOLCHAIN/bin/x86_64-linux-android${API}-clang"
          echo "CC_armv7_linux_androideabi=$TOOLCHAIN/bin/armv7a-linux-androideabi${API}-clang"
          echo "CXX_armv7_linux_androideabi=$TOOLCHAIN/bin/armv7a-linux-androideabi${API}-clang++"
          echo "AR_armv7_linux_androideabi=$TOOLCHAIN/bin/llvm-ar"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android${API}-clang"
          echo "CXX_aarch64_linux_android=$TOOLCHAIN/bin/aarch64-linux-android${API}-clang++"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/bin/llvm-ar"
          echo "CC_i686_linux_android=$TOOLCHAIN/bin/i686-linux-android${API}-clang"
          echo "CXX_i686_linux_android=$TOOLCHAIN/bin/i686-linux-android${API}-clang++"
          echo "AR_i686_linux_android=$TOOLCHAIN/bin/llvm-ar"
          echo "CC_x86_64_linux_android=$TOOLCHAIN/bin/x86_64-linux-android${API}-clang"
          echo "CXX_x86_64_linux_android=$TOOLCHAIN/bin/x86_64-linux-android${API}-clang++"
          echo "AR_x86_64_linux_android=$TOOLCHAIN/bin/llvm-ar"
        } >> "$GITHUB_ENV"
        echo "$TOOLCHAIN/bin" >> "$GITHUB_PATH"

    - name: Install build tools
      shell: bash
      run: sudo apt-get install -y pkg-config libssl-dev

    - name: Install Rust nightly
      if: ${{ inputs.install-rust == 'true' }}
      shell: bash
      # rust-src is required: Android release builds go through
      # `cargo +nightly build -Z build-std` (see tools/scripts/build-android.sh).
      run: |
        rustup toolchain install nightly --profile minimal --component rust-src
        rustup default nightly
        rustc --version

    - name: Cache cargo
      if: ${{ inputs.install-rust == 'true' }}
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
        restore-keys: |
          ${{ runner.os }}-cargo-
