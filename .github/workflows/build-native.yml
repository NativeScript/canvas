# Reusable workflow that builds every native artifact the npm packages ship:
#
#   artifact name          contents                              destination in the repo
#   ---------------------  ------------------------------------  ---------------------------------------------
#   canvas-android         canvas-release.aar                    packages/canvas/platforms/android/
#   canvas-ios             CanvasNative.xcframework (tar.gz)     packages/canvas/platforms/ios/CanvasNativeBinary/
#   canvas-svg-android     canvassvg-release.aar                 packages/canvas-svg/platforms/android/
#   canvas-svg-ios         CanvasSVG.xcframework (tar.gz)        packages/canvas-svg/platforms/ios/CanvasSVGBinary/
#   audio-context-android  audiocontext-release.aar              packages/audio-context/platforms/android/
#   audio-context-ios      AudioContextNative.xcframework        packages/audio-context/platforms/ios/AudioContextNativeBinary/
#                          (tar.gz)
#   canvas-windows-<arch>  canvasnative.node + ANGLE DLLs        packages/canvas/platforms/windows/<arch>/
#   <module>-windows-      canvassvg.node, audiocontext.node,    packages/<module>/platforms/windows/<arch>/
#     <arch>               canvasmedia.node, canvasgamepad.node
#   linux-<arch>           every package's .node                 packages/<package>/platforms/linux/lib/<arch>/
#                          (tree rooted at packages/)
#
# tools/scripts/place-native-artifacts.sh copies a download of all of them into the tree.
#
# Not built here: the <plugin>.aar files under platforms/android (canvas_gamepad.aar,
# canvas_media.aar, canvas_polyfill.aar) are gitignored. The NativeScript CLI builds them from
# platforms/android/java during the app build. canvas-polyfill's async-release.aar ships as committed.
#
# xcframeworks are tarred before upload because upload-artifact does not
# preserve file permissions.
#
# The canvas build mirrors the local flow:
#   Apple:   one runner per platform (ios, visionos, tvos, catalyst) runs `make <platform>` and
#            `canvas-build.sh <platform>` for its framework slices; canvas-ios joins them with
#            `canvas-build.sh --xcframework`. Locally, `npm run build.canvas.ios.framework.release`
#            does all of it on one machine. canvas-svg is split the same way.
#   Android: make android, then gradle :canvas:assembleRelease and copy the aar
#
#   Linux:   tools/scripts/build-linux.sh on Ubuntu 22.04 (glibc 2.35, GTK 4.6), natively on
#            x64 and arm64 runners, then the Node-API tests on Mesa (surfaceless EGL, lavapipe).
#
#   Windows: tools/scripts/build-napi.sh <triple> release-napi [<crate>] (`make windows`,
#            `make windows-svg`, `make windows-audio`, `make windows-media`); the modules other
#            than canvasnative.node share one matrix job (napi-windows). Skia builds from source
#            with the runner's LLVM and ninja, as locally with .tools/env.sh
#            (.github/actions/setup-windows-native). arm64 is cross-compiled; the x64 jobs also
#            run the Node-API test suites on the shipped modules (on WARP: runners have no GPU;
#            audio renders offline and on the 'none' sink: they have no audio device either).
#
# Each job restores its output from .github/actions/native-cache, and skips the build when the files
# it lists as `inputs` are unchanged. The jobs that build Skia also keep its built libraries per
# target in .github/actions/skia-cache, saved only by pushes to master.
name: Build Native

permissions:
  contents: read

on:
  workflow_call:

env:
  # bump to invalidate the opus deps cache
  NATIVE_CACHE_VERSION: v1

jobs:
  canvas-android:
    name: Canvas Android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-cache
        id: cache
        with:
          name: canvas-android
          path: packages/canvas/platforms/android/canvas-release.aar
          inputs: >-
            Cargo.toml .cargo Makefile
            crates :!crates/canvas-svg* :!crates/canvas-ios :!crates/*-napi/*
            V8_RELEASE NATIVESCRIPT_IOS_RUNTIME_REF tools/scripts/download-v8.sh
            tools/scripts/build-android-v8-stub.sh tools/scripts/build-android.sh
            packages/canvas/src-native/canvas-android packages/canvas/platforms/ios/src/cpp
      - uses: ./.github/actions/setup-android-native
        if: steps.cache.outputs.cache-hit != 'true'
      - uses: ./.github/actions/skia-cache
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          name: canvas-android
      - name: Fetch V8 + NativeScript runtime headers
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./tools/scripts/download-v8.sh
      - name: Build libNativeScript.so stub for linking
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./tools/scripts/build-android-v8-stub.sh
      - name: Build Rust libraries
        if: steps.cache.outputs.cache-hit != 'true'
        run: make android
      # Saved right after the Rust build, so a later failing step cannot drop the cache.
      - uses: ./.github/actions/skia-cache
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          name: canvas-android
          save: 'true'
      - name: Build canvas AAR
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: packages/canvas/src-native/canvas-android
        run: ./gradlew :canvas:assembleRelease
      - name: Copy AAR into platforms/android
        if: steps.cache.outputs.cache-hit != 'true'
        run: cp packages/canvas/src-native/canvas-android/canvas/build/outputs/aar/canvas-release.aar packages/canvas/platforms/android/canvas-release.aar
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-android
          path: packages/canvas/platforms/android/canvas-release.aar
          if-no-files-found: error

  # The xcframeworks built by several jobs: a hit uploads one here, on Linux, and its macOS jobs never
  # start. On a miss the last of them saves it under this job's key.
  apple-cache:
    name: Apple xcframeworks (cached)
    runs-on: ubuntu-22.04
    outputs:
      canvas-hit: ${{ steps.canvas.outputs.cache-hit }}
      canvas-key: ${{ steps.canvas.outputs.key }}
      svg-hit: ${{ steps.svg.outputs.cache-hit }}
      svg-key: ${{ steps.svg.outputs.key }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-cache
        id: canvas
        with:
          name: canvas-ios
          path: canvas-ios.tar.gz
          restore-only: 'true'
          inputs: >-
            Cargo.toml .cargo Makefile
            crates :!crates/canvas-svg* :!crates/canvas-android :!crates/*-napi/*
            V8_RELEASE NATIVESCRIPT_IOS_RUNTIME_REF tools/scripts/download-v8.sh
            tools/scripts/canvas-build.sh packages/canvas/src-native/canvas-ios
      - uses: actions/upload-artifact@v4
        if: steps.canvas.outputs.cache-hit == 'true'
        with:
          name: canvas-ios
          path: canvas-ios.tar.gz
      - uses: ./.github/actions/native-cache
        id: svg
        with:
          name: canvas-svg-ios
          path: canvas-svg-ios.tar.gz
          restore-only: 'true'
          inputs: >-
            Cargo.toml .cargo Makefile
            crates :!crates/canvas-2d :!crates/canvas-c :!crates/canvas-webgl :!crates/canvas-android :!crates/canvas-ios :!crates/*-napi/* :!crates/canvas-svg-android
            tools/scripts/canvas-svg-build.sh packages/canvas-svg/src-native/ios
      - uses: actions/upload-artifact@v4
        if: steps.svg.outputs.cache-hit == 'true'
        with:
          name: canvas-svg-ios
          path: canvas-svg-ios.tar.gz

  # One runner per platform: its Rust targets, then its framework slices. The Xcode pre-build
  # phase reruns cargo for each slice, so the slices are built in the job that owns the target dir.
  canvas-apple:
    name: Canvas ${{ matrix.platform }}
    needs: apple-cache
    if: needs.apple-cache.outputs.canvas-hit != 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, visionos, tvos, catalyst]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-apple-native
      - uses: ./.github/actions/skia-cache
        with:
          name: canvas-${{ matrix.platform }}
      - name: Fetch V8 + NativeScript runtime headers
        run: ./tools/scripts/download-v8.sh
      - name: Build Rust libraries
        run: make ${{ matrix.platform }}
      # Saved right after the Rust build, so a later failing step cannot drop the cache.
      - uses: ./.github/actions/skia-cache
        with:
          name: canvas-${{ matrix.platform }}
          save: 'true'
      - name: Build CanvasNative.framework slices
        working-directory: tools/scripts
        run: sh canvas-build.sh ${{ matrix.platform }}
      # tar keeps the Catalyst framework's symlinks and the file modes
      - name: Pack slices
        working-directory: packages/canvas/src-native/canvas-ios/dist
        run: tar -czf "$GITHUB_WORKSPACE/canvas-apple-${{ matrix.platform }}.tar.gz" Release-*/CanvasNative.framework Release-*/CanvasNative.framework.dSYM
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-apple-${{ matrix.platform }}
          path: canvas-apple-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  canvas-ios:
    name: Canvas xcframework
    needs: [apple-cache, canvas-apple]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^16.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: canvas-apple-*
          merge-multiple: true
          path: slices
      - name: Unpack slices
        run: |
          mkdir -p packages/canvas/src-native/canvas-ios/dist
          for f in slices/*.tar.gz; do tar -xzf "$f" -C packages/canvas/src-native/canvas-ios/dist; done
      - name: Build CanvasNative.xcframework
        working-directory: tools/scripts
        run: sh canvas-build.sh --xcframework
      - name: Pack xcframework
        run: tar -czf canvas-ios.tar.gz -C packages/canvas/platforms/ios/CanvasNativeBinary CanvasNative.xcframework
      - uses: actions/cache/save@v4
        if: github.ref_type != 'tag'
        with:
          path: canvas-ios.tar.gz
          key: ${{ needs.apple-cache.outputs.canvas-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-ios
          path: canvas-ios.tar.gz
          if-no-files-found: error

  canvas-svg-android:
    name: Canvas SVG Android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-cache
        id: svg-aar
        with:
          name: canvas-svg-android
          path: packages/canvas-svg/platforms/android/canvassvg-release.aar
          inputs: >-
            Cargo.toml .cargo Makefile
            crates :!crates/canvas-2d :!crates/canvas-c :!crates/canvas-webgl :!crates/canvas-android :!crates/canvas-ios :!crates/*-napi/* :!crates/canvas-svg-ios
            V8_RELEASE NATIVESCRIPT_IOS_RUNTIME_REF tools/scripts/download-v8.sh
            tools/scripts/build-android-v8-stub.sh
            tools/scripts/build-svg-android.sh tools/scripts/copy-svg-android.sh
            packages/canvas-svg/src-native/android packages/canvas-svg/platforms/ios/src/cpp
            packages/canvas/src-native/canvas-android/canvas/src/main/cpp
      - uses: ./.github/actions/setup-android-native
        if: steps.svg-aar.outputs.cache-hit != 'true'
      - uses: ./.github/actions/skia-cache
        if: steps.svg-aar.outputs.cache-hit != 'true'
        with:
          name: canvas-svg-android
      # canvassvg's CMake borrows both from packages/canvas (see its CMakeLists.txt)
      - name: Fetch V8 + NativeScript runtime headers
        if: steps.svg-aar.outputs.cache-hit != 'true'
        run: ./tools/scripts/download-v8.sh
      - name: Build libNativeScript.so stub for linking
        if: steps.svg-aar.outputs.cache-hit != 'true'
        run: ./tools/scripts/build-android-v8-stub.sh
      - name: Build Rust libraries
        if: steps.svg-aar.outputs.cache-hit != 'true'
        run: make android-svg
      # Saved right after the Rust build, so a later failing step cannot drop the cache.
      - uses: ./.github/actions/skia-cache
        if: steps.svg-aar.outputs.cache-hit != 'true'
        with:
          name: canvas-svg-android
          save: 'true'
      - name: Copy .so files into jniLibs
        if: steps.svg-aar.outputs.cache-hit != 'true'
        run: sh tools/scripts/copy-svg-android.sh
      - name: Build canvassvg AAR
        if: steps.svg-aar.outputs.cache-hit != 'true'
        working-directory: packages/canvas-svg/src-native/android
        run: ./gradlew :canvassvg:assembleRelease
      - name: Copy AAR into platforms/android
        if: steps.svg-aar.outputs.cache-hit != 'true'
        run: cp packages/canvas-svg/src-native/android/canvassvg/build/outputs/aar/canvassvg-release.aar packages/canvas-svg/platforms/android/canvassvg-release.aar
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-svg-android
          path: packages/canvas-svg/platforms/android/canvassvg-release.aar
          if-no-files-found: error

  canvas-svg-apple:
    name: Canvas SVG ${{ matrix.platform }}
    needs: apple-cache
    if: needs.apple-cache.outputs.svg-hit != 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, visionos, tvos, catalyst]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-apple-native
      - uses: ./.github/actions/skia-cache
        with:
          name: canvas-svg-${{ matrix.platform }}
      - name: Build Rust libraries
        run: make ${{ matrix.platform }}-svg
      # Saved right after the Rust build, so a later failing step cannot drop the cache.
      - uses: ./.github/actions/skia-cache
        with:
          name: canvas-svg-${{ matrix.platform }}
          save: 'true'
      - name: Build CanvasSVG.framework slices
        working-directory: tools/scripts
        run: sh canvas-svg-build.sh ${{ matrix.platform }}
      - name: Pack slices
        working-directory: packages/canvas-svg/src-native/ios/dist
        run: tar -czf "$GITHUB_WORKSPACE/canvas-svg-apple-${{ matrix.platform }}.tar.gz" Release-*/CanvasSVG.framework Release-*/CanvasSVG.framework.dSYM
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-svg-apple-${{ matrix.platform }}
          path: canvas-svg-apple-${{ matrix.platform }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  canvas-svg-ios:
    name: Canvas SVG xcframework
    needs: [apple-cache, canvas-svg-apple]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^16.0'
      - uses: actions/download-artifact@v4
        with:
          pattern: canvas-svg-apple-*
          merge-multiple: true
          path: slices
      - name: Unpack slices
        run: |
          mkdir -p packages/canvas-svg/src-native/ios/dist
          for f in slices/*.tar.gz; do tar -xzf "$f" -C packages/canvas-svg/src-native/ios/dist; done
      - name: Build CanvasSVG.xcframework
        working-directory: tools/scripts
        run: sh canvas-svg-build.sh --xcframework
      - name: Pack xcframework
        run: tar -czf canvas-svg-ios.tar.gz -C packages/canvas-svg/platforms/ios/CanvasSVGBinary CanvasSVG.xcframework
      - uses: actions/cache/save@v4
        if: github.ref_type != 'tag'
        with:
          path: canvas-svg-ios.tar.gz
          key: ${{ needs.apple-cache.outputs.svg-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-svg-ios
          path: canvas-svg-ios.tar.gz
          if-no-files-found: error

  audio-context-android:
    name: AudioContext Android
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Oboe
          submodules: true
      - uses: ./.github/actions/native-cache
        id: audio-aar
        with:
          name: audio-context-android
          path: packages/audio-context/platforms/android/audiocontext-release.aar
          inputs: >-
            packages/audio-context/src-native/android
      - uses: actions/setup-java@v4
        if: steps.audio-aar.outputs.cache-hit != 'true'
        with:
          distribution: temurin
          java-version: '17'
      # read-only off master, see setup-android-native
      - uses: gradle/actions/setup-gradle@v4
        if: steps.audio-aar.outputs.cache-hit != 'true'
      - name: Setup Android SDK
        if: steps.audio-aar.outputs.cache-hit != 'true'
        uses: android-actions/setup-android@v4
      - name: Build audiocontext AAR
        if: steps.audio-aar.outputs.cache-hit != 'true'
        working-directory: packages/audio-context/src-native/android
        run: ./gradlew :audiocontext:assembleRelease
      - name: Copy AAR into platforms/android
        if: steps.audio-aar.outputs.cache-hit != 'true'
        run: cp packages/audio-context/src-native/android/audiocontext/build/outputs/aar/audiocontext-release.aar packages/audio-context/platforms/android/audiocontext-release.aar
      - uses: actions/upload-artifact@v4
        with:
          name: audio-context-android
          path: packages/audio-context/platforms/android/audiocontext-release.aar
          if-no-files-found: error

  audio-context-ios:
    name: AudioContext iOS + visionOS + tvOS + Catalyst
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-cache
        id: audio-xcframework
        with:
          name: audio-context-ios
          path: audio-context-ios.tar.gz
          inputs: >-
            packages/audio-context/src-native/ios tools/scripts/audio-context-build.sh
      - uses: ./.github/actions/setup-apple-native
        if: steps.audio-xcframework.outputs.cache-hit != 'true'
        with:
          install-rust: 'false'
      # libogg / libvorbis / libopus / libopusfile static libs per slice: gitignored, built from
      # the xiph release tarballs.
      - name: Restore cached opus deps
        if: steps.audio-xcframework.outputs.cache-hit != 'true'
        id: opus-deps
        uses: actions/cache@v4
        with:
          path: packages/audio-context/src-native/ios/AudioContextNative/AudioContextNative/third_party/build
          key: ${{ env.NATIVE_CACHE_VERSION }}-audio-context-opus-deps-${{ hashFiles('packages/audio-context/src-native/ios/AudioContextNative/AudioContextNative/scripts/fetch_opus_deps.sh', 'packages/audio-context/src-native/ios/AudioContextNative/AudioContextNative/scripts/build_opus_deps_ios.sh') }}
      - name: Build opus deps
        if: steps.audio-xcframework.outputs.cache-hit != 'true' && steps.opus-deps.outputs.cache-hit != 'true'
        working-directory: packages/audio-context/src-native/ios/AudioContextNative/AudioContextNative
        run: |
          # opusfile's configure finds the ogg and opus it builds against through pkg-config
          command -v pkg-config || brew install pkgconf
          ./scripts/build_opus_deps_ios.sh
      # same as `npm run build.audiocontext.ios.framework.release`
      - name: Build AudioContextNative.xcframework
        if: steps.audio-xcframework.outputs.cache-hit != 'true'
        working-directory: tools/scripts
        run: sh audio-context-build.sh
      - name: Pack xcframework
        if: steps.audio-xcframework.outputs.cache-hit != 'true'
        run: tar -czf audio-context-ios.tar.gz -C packages/audio-context/platforms/ios/AudioContextNativeBinary AudioContextNative.xcframework
      - uses: actions/upload-artifact@v4
        with:
          name: audio-context-ios
          path: audio-context-ios.tar.gz
          if-no-files-found: error

  canvas-windows:
    name: Canvas Windows (${{ matrix.arch }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-cache
        id: cache
        with:
          name: canvas-windows-${{ matrix.arch }}
          path: packages/canvas/platforms/windows/${{ matrix.arch }}/
          inputs: >-
            Cargo.toml .cargo
            crates :!crates/canvas-svg* :!crates/canvas-android :!crates/canvas-ios
            :!crates/audio-context-napi :!crates/canvas-media-napi :!crates/canvas-gamepad-napi
            tools/scripts/build-napi.sh tools/scripts/download-angle.sh
      - uses: ./.github/actions/setup-windows-native
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          target: ${{ matrix.target }}
      - uses: ./.github/actions/skia-cache
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          name: canvas-windows-${{ matrix.arch }}
      - uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: '22'
      - name: Build canvasnative.node (and fetch ANGLE)
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./tools/scripts/build-napi.sh ${{ matrix.target }} release-napi
      # arm64 is cross-compiled, so only x64 runs them. The runners have no GPU: D3D12 and ANGLE
      # fall back to WARP, and the WebGPU suites skip without an adapter.
      # Saved right after the Rust build, so a later failing step cannot drop the cache.
      - uses: ./.github/actions/skia-cache
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          name: canvas-windows-${{ matrix.arch }}
          save: 'true'
      - name: Node-API tests
        if: steps.cache.outputs.cache-hit != 'true' && matrix.arch == 'x64'
        env:
          CANVAS_NAPI_ADDON: ${{ github.workspace }}\packages\canvas\platforms\windows\x64\canvasnative.node
        run: node --expose-gc --test "crates/canvas-napi/__test__/*.test.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: canvas-windows-${{ matrix.arch }}
          path: packages/canvas/platforms/windows/${{ matrix.arch }}/
          if-no-files-found: error

  # The Node-API modules other than canvasnative.node: one entry per module.
  napi-windows:
    name: ${{ matrix.module.name }} Windows (${{ matrix.arch }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        module:
          # `sources`: every crate the module is built from (its cache key).
          - name: canvas-svg
            crate: canvas-svg-napi
            file: canvassvg.node
            addon-env: CANVAS_SVG_NAPI_ADDON
            sources: crates/canvas-svg crates/canvas-svg-c crates/canvas-svg-napi crates/canvas-utils crates/canvas-core crates/gl-bindings
            skia: true
          # Runners have no audio device: its suite renders offline and on the 'none' sink.
          - name: audio-context
            crate: audio-context-napi
            file: audiocontext.node
            addon-env: AUDIO_CONTEXT_NAPI_ADDON
            sources: crates/audio-context-napi
          - name: canvas-media
            crate: canvas-media-napi
            file: canvasmedia.node
            addon-env: CANVAS_MEDIA_NAPI_ADDON
            sources: crates/canvas-media-napi
          # no Node-API test suite
          - name: canvas-gamepad
            crate: canvas-gamepad-napi
            file: canvasgamepad.node
            sources: crates/canvas-gamepad-napi
        arch: [x64, arm64]
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: arm64
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    env:
      MODULE_DIR: packages/${{ matrix.module.name }}/platforms/windows/${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-cache
        id: cache
        with:
          name: ${{ matrix.module.name }}-windows-${{ matrix.arch }}
          path: ${{ env.MODULE_DIR }}/${{ matrix.module.file }}
          inputs: >-
            Cargo.toml .cargo crates/vendor tools/scripts/build-napi.sh ${{ matrix.module.sources }}
      - uses: ./.github/actions/setup-windows-native
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          target: ${{ matrix.target }}
      - uses: ./.github/actions/skia-cache
        if: steps.cache.outputs.cache-hit != 'true' && matrix.module.skia
        with:
          name: ${{ matrix.module.name }}-windows-${{ matrix.arch }}
      - uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true' && matrix.arch == 'x64' && matrix.module.addon-env
        with:
          node-version: '22'
      - name: Build ${{ matrix.module.file }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./tools/scripts/build-napi.sh ${{ matrix.target }} release-napi ${{ matrix.module.crate }}
      # arm64 is cross-compiled, so only x64 runs them. The timeout bounds a test process that
      # hangs on exit (an addon releasing Media Foundation / D3D objects during process shutdown).
      # Saved right after the Rust build, so a later failing step cannot drop the cache.
      - uses: ./.github/actions/skia-cache
        if: steps.cache.outputs.cache-hit != 'true' && matrix.module.skia
        with:
          name: ${{ matrix.module.name }}-windows-${{ matrix.arch }}
          save: 'true'
      - name: Node-API tests
        if: steps.cache.outputs.cache-hit != 'true' && matrix.arch == 'x64' && matrix.module.addon-env
        timeout-minutes: 5
        run: |
          export ${{ matrix.module.addon-env }}="$(cygpath -w "$PWD/$MODULE_DIR/${{ matrix.module.file }}")"
          node --expose-gc --test "crates/${{ matrix.module.crate }}/__test__/*.test.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module.name }}-windows-${{ matrix.arch }}
          path: ${{ env.MODULE_DIR }}/
          if-no-files-found: error

  # Every package's Linux Node-API module in one job: canvasnative.node and canvassvg.node share
  # the Skia build. Natively on each arch (no cross sysroot).
  linux:
    name: Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-cache
        id: cache
        with:
          name: linux-${{ matrix.arch }}
          path: packages/*/platforms/linux/lib/${{ matrix.arch }}/
          inputs: >-
            Cargo.toml .cargo
            crates :!crates/canvas-android :!crates/canvas-ios :!crates/canvas-svg-android :!crates/canvas-svg-ios
            tools/scripts/build-linux.sh
      - uses: ./.github/actions/setup-linux-native
        if: steps.cache.outputs.cache-hit != 'true'
      - uses: ./.github/actions/skia-cache
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          name: linux-${{ matrix.arch }}
      - uses: actions/setup-node@v4
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          node-version: '22'
      - name: Build the Node-API modules
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./tools/scripts/build-linux.sh
      # Mesa's surfaceless EGL (llvmpipe) for 2D / WebGL and lavapipe for WebGPU: no GPU here.
      # canvas-media's suite drives Media Foundation, so it is Windows only.
      # Saved right after the Rust build, so a later failing step cannot drop the cache.
      - uses: ./.github/actions/skia-cache
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          name: linux-${{ matrix.arch }}
          save: 'true'
      - name: Node-API tests
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CANVAS_NAPI_ADDON: ${{ github.workspace }}/packages/canvas/platforms/linux/lib/${{ matrix.arch }}/canvasnative.node
          CANVAS_SVG_NAPI_ADDON: ${{ github.workspace }}/packages/canvas-svg/platforms/linux/lib/${{ matrix.arch }}/canvassvg.node
          AUDIO_CONTEXT_NAPI_ADDON: ${{ github.workspace }}/packages/audio-context/platforms/linux/lib/${{ matrix.arch }}/audiocontext.node
        timeout-minutes: 10
        run: |
          node --expose-gc --test "crates/canvas-napi/__test__/*.test.mjs"
          node --expose-gc --test "crates/canvas-svg-napi/__test__/*.test.mjs"
          node --expose-gc --test "crates/audio-context-napi/__test__/*.test.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: packages/*/platforms/linux/lib/${{ matrix.arch }}/
          if-no-files-found: error
