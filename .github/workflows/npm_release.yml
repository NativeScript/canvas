# Publishes the @nativescript/canvas suite to npm. Run it on the release tag:
#
#   gh workflow run npm_release.yml -R NativeScript/canvas --ref 3.0.0-beta.7
#
# (or pick the tag under "Use workflow from"). The tag must match packages/canvas/package.json.
#
# Every native artifact build-native.yml produces (Android AARs, iOS/visionOS/tvOS
# xcframeworks, Windows and Linux Node-API modules) is built from the tag and placed before
# packaging, replacing any committed copy, so npm ships what CI built from the tagged
# sources. The committed binaries are only what local development uses; the xcframeworks
# are not committed at all. canvas-polyfill's async-release.aar is the one native artifact
# that still ships as committed.
#
# Running on the tag also keeps the build's caches safe: a run can restore master's cache
# entries but saves only into its own ref's scope, so nothing a release executes can
# replace an entry that master's builds restore.
#
# iOS SwiftPM distribution: canvas, canvas-svg and audio-context reference two local
# `path` SwiftPM packages shipped inside the npm package (see their nativescript.config.ts):
#   * platforms/ios/NativeScriptV8: the header-only V8 shim (repo-root nativescript-v8/).
#   * platforms/ios/<Framework>Binary: a binaryTarget for the plugin's xcframework. The
#     frameworks are too large for npm, so tools/scripts/release-ios-binaries.sh uploads
#     them to the GitHub release for the tag and stamps the zip's url + checksum into
#     Package.swift. SwiftPM then downloads just the zip.
# Never a repositoryURL: SwiftPM clones a repository's entire git history just to read
# Package.swift, and this repo's history is several GB, so first builds stall for 20+ min.
#
# Authentication uses npm Trusted Publishing (OIDC) — no NPM_TOKEN required.
# This mirrors the proven publish flow in the @nativescript/ios and
# @nativescript/font-manager repos:
#   * the job runs in the `npm-publish` environment, which MUST match the
#     environment configured on the npm Trusted Publisher for EACH package
#     (repo NativeScript/canvas + workflow npm_release.yml + env npm-publish).
#     A Trusted Publisher must be configured on npmjs.com for every package
#     listed in PACKAGES below, or its publish is rejected (404/ENEEDAUTH).
#   * npm is upgraded to 11.5.1 via corepack (Trusted Publishing needs >=11.5.1;
#     `npm i -g npm@latest` corrupts the global install and drops bundled deps
#     like sigstore — npm/cli#9722).
#   * the .npmrc that setup-node writes is removed and NODE_AUTH_TOKEN cleared
#     before publish so an empty token can't shadow the OIDC exchange.
name: npm Release

on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: 'Reuse native artifacts from this earlier run of the same tag instead of rebuilding'
        required: false
        default: ''

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "error: run this on the release tag (gh workflow run npm_release.yml --ref <tag>), not $GITHUB_REF" >&2
            exit 1
          fi
          VERSION="$GITHUB_REF_NAME"
          PACKAGE_VERSION="$(node -p "require('./packages/canvas/package.json').version")"
          if [ "$VERSION" != "$PACKAGE_VERSION" ]; then
            echo "error: tag $VERSION does not match packages/canvas/package.json ($PACKAGE_VERSION)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-native:
    name: Build Native
    needs: [version]
    if: inputs.native_run_id == ''
    uses: ./.github/workflows/build-native.yml

  publish:
    runs-on: ubuntu-latest
    needs: [version, build-native]
    if: ${{ !cancelled() && needs.version.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.build-native.result) }}
    environment: npm-publish # must match the npm Trusted Publisher environment
    permissions:
      contents: write # upload the iOS xcframeworks to the GitHub release
      actions: read # download artifacts from native_run_id
      id-token: write # required for npm Trusted Publishing (OIDC) + provenance
    env:
      # Single source of truth for the packages to publish (space separated).
      PACKAGES: 'audio-context canvas canvas-babylon canvas-chartjs canvas-media canvas-phaser canvas-phaser-ce canvas-pixi canvas-polyfill canvas-svg canvas-three canvas-gamepad'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm (required for OIDC trusted publishing)
        run: |
          corepack enable npm
          corepack install -g npm@11.5.1
          test "$(npm --version)" = "11.5.1"

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-artifacts
          run-id: ${{ inputs.native_run_id || github.run_id }}
          github-token: ${{ inputs.native_run_id != '' && github.token || '' }}

      - name: Place native artifacts
        run: ./tools/scripts/place-native-artifacts.sh native-artifacts

      # canvas commits no lockfile, so `npm install` (not `npm ci`).
      - name: Install dependencies
        run: npm install

      # The V8 + NativeScript runtime headers under nativescript-v8/Headers are
      # fetched, not committed (see .gitignore + tools/scripts/download-v8.sh),
      # and the build copies that tree into each package's NativeScriptV8
      # SwiftPM shim. Without this step a fresh checkout ships a shim whose
      # Headers/include holds only the tracked libffi files, and every
      # consumer's iOS build dies on Common.h's `#include "include/v8.h"`.
      - name: Vendor V8 + NativeScript runtime headers
        run: ./tools/scripts/download-v8.sh

      - name: Build packages
        run: npx nx run-many --target=build.all --projects="$(echo "$PACKAGES" | tr ' ' ',')"

      # The iOS SwiftPM shim must ship inside the npm packages that declare a
      # local-path SPM package in their nativescript.config.ts — if it's
      # missing, every consumer's Xcode resolution fails (or worse, someone
      # "fixes" it by reverting to a repositoryURL reference and reintroduces
      # the 20+ minute full-history clone).
      - name: Verify iOS SwiftPM shim in built packages
        run: |
          set -euo pipefail
          for pkg in canvas canvas-svg audio-context; do
            dir="dist/packages/$pkg/platforms/ios/NativeScriptV8"
            # Check real files, not just the directories: Headers/ also holds
            # the committed inspector/ + libffi trees, so an `-e Headers` test
            # passes even when download-v8.sh never ran and the actual V8
            # headers are absent (that shipped in 3.0.0-alpha.0).
            for required in "$dir/Package.swift" "$dir/Sources/NativeScriptV8.c" \
                            "$dir/Headers/include/v8.h" "$dir/Headers/include/v8config.h"; do
              if [ ! -f "$required" ]; then
                echo "error: $required missing — the NativeScriptV8 SPM shim was not packaged (did tools/scripts/download-v8.sh run?)" >&2
                exit 1
              fi
            done
            if [ -z "$(ls -A "$dir/Headers/runtime" 2>/dev/null)" ]; then
              echo "error: $dir/Headers/runtime is empty — the NativeScript runtime headers were not vendored" >&2
              exit 1
            fi
            # match only a real `repositoryURL:` key — the config's comments
            # legitimately mention the word while explaining why it's banned
            if grep -v -E '^[[:space:]]*(//|\*)' "dist/packages/$pkg/nativescript.config.ts" | grep -q -E 'repositoryURL[[:space:]]*:'; then
              echo "error: dist/packages/$pkg/nativescript.config.ts declares a repositoryURL — plugin SPM packages must use a local path (full-history clone is 8+ GB)" >&2
              exit 1
            fi
            echo "ok: $pkg ships the NativeScriptV8 shim with a local-path config"
          done

      # place-native-artifacts.sh put the CI-built binaries in packages/; check nx copied them.
      - name: Verify native artifacts in built packages
        run: |
          set -euo pipefail
          for f in \
            canvas/platforms/android/canvas-release.aar \
            canvas/platforms/ios/CanvasNativeBinary/CanvasNative.xcframework/Info.plist \
            canvas-svg/platforms/android/canvassvg-release.aar \
            canvas-svg/platforms/ios/CanvasSVGBinary/CanvasSVG.xcframework/Info.plist \
            audio-context/platforms/android/audiocontext-release.aar \
            audio-context/platforms/ios/AudioContextNativeBinary/AudioContextNative.xcframework/Info.plist; do
            [ -f "dist/packages/$f" ] || { echo "error: dist/packages/$f missing" >&2; exit 1; }
          done
          for arch in x64 arm64; do
            for module in canvas/canvasnative canvas-svg/canvassvg audio-context/audiocontext canvas-media/canvasmedia canvas-gamepad/canvasgamepad; do
              pkg=${module%%/*}
              name=${module##*/}
              for f in "$pkg/platforms/windows/$arch/$name.node" "$pkg/platforms/linux/lib/$arch/$name.node"; do
                [ -f "dist/packages/$f" ] || { echo "error: dist/packages/$f missing" >&2; exit 1; }
              done
            done
          done
          echo "ok: every package ships its native artifacts"

      # Before publishing, so a published package never points at a missing asset.
      - name: Move iOS xcframeworks to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tools/scripts/release-ios-binaries.sh "${{ needs.version.outputs.version }}"

      # Publish each package at its committed version via OIDC. The setup-node
      # .npmrc and NODE_AUTH_TOKEN are cleared so npm performs the Trusted
      # Publishing token exchange (per package) and generates provenance.
      # Versions already on npm are skipped so the run is re-runnable and one
      # unchanged package can't fail the whole release.
      - name: Publish packages (OIDC trusted publishing)
        env:
          NODE_AUTH_TOKEN: ''
        run: |
          set -euo pipefail
          unset NODE_AUTH_TOKEN
          if [ -n "${NPM_CONFIG_USERCONFIG:-}" ]; then
            rm -f "$NPM_CONFIG_USERCONFIG"
          fi
          published=""
          skipped=""
          for pkg in $PACKAGES; do
            dir="dist/packages/$pkg"
            if [ ! -f "$dir/package.json" ]; then
              echo "error: $dir/package.json not found (build missing?)" >&2
              exit 1
            fi
            name="$(node -p "require('./$dir/package.json').name")"
            ver="$(node -p "require('./$dir/package.json').version")"
            # dist-tag: prerelease label if the version has one, else latest
            if [ "$ver" != "${ver#*-}" ]; then
              tag="$(printf '%s' "${ver#*-}" | cut -d. -f1)"
            else
              tag="latest"
            fi
            if [ "$(npm view "$name@$ver" version 2>/dev/null || true)" = "$ver" ]; then
              echo "==> $name@$ver already published — skipping"
              skipped="$skipped $name@$ver"
              continue
            fi
            echo "==> publishing $name@$ver (tag: $tag)"
            ( cd "$dir" && npm publish --access public --provenance --tag "$tag" )
            published="$published $name@$ver"
          done
          echo ""
          echo "published:${published:- none}"
          echo "skipped:${skipped:- none}"

      - name: Verify npm publish
        run: |
          set -euo pipefail
          for pkg in $PACKAGES; do
            name="$(node -p "require('./dist/packages/$pkg/package.json').name")"
            ver="$(node -p "require('./dist/packages/$pkg/package.json').version")"
            ok=false
            for i in $(seq 1 10); do
              if [ "$(npm view "$name@$ver" version 2>/dev/null || true)" = "$ver" ]; then
                echo "ok: $name@$ver is live"
                ok=true
                break
              fi
              echo "  $name@$ver not visible yet, retrying ($i/10)..."
              sleep 15
            done
            if [ "$ok" != true ]; then
              echo "error: $name@$ver not visible on the registry" >&2
              exit 1
            fi
          done
