[package]
name = "canvas-2d"
version = "2.0.0"
edition = "2021"

[features]
metal = ["skia-safe/metal", "canvas-core/mtl"]
gl = ["skia-safe/gl", "canvas-core/gl"]
vulkan = ["skia-safe/vulkan", "canvas-core/vulkan"]
# Windows: Skia on Direct3D 12, presented through composition swapchains.
d3d = ["skia-safe/d3d", "canvas-core/d3d", "dep:windows"]
default = ["gl"]

[dependencies]
canvas-core = { workspace = true, features = ["2d", "gl"] }
parking_lot.workspace = true
ustr.workspace = true
base64 = "0.22.1"
encoding_rs = "0.8.35"
gl-bindings = { workspace = true }
csscolorparser = { version = "0.7.1", features = ["named-colors", "rust-rgb"] }
log.workspace = true
skia-safe = { workspace = true, features = ["textlayout"] }
bytes = "1.7.2"
env_logger = "0.11.2"
ash = { version = "0.38.0", optional = true, features = ["libloading"] }
raw-window-handle.workspace = true
bitflags = "2.6.0"
regex-lite = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, optional = true, features = ["Win32_Foundation", "Win32_Graphics_Direct3D11", "Win32_Graphics_Direct3D11on12", "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi_Common"] }

[target.'cfg(any(target_os = "ios", target_os="macos", target_os = "visionos", target_os = "tvos"))'.dependencies]
foreign-types-shared = "0.3.1"
objc2 = {workspace = true}
objc2-foundation = { workspace = true }
objc2-metal = { workspace = true }
objc2-quartz-core = { workspace = true }