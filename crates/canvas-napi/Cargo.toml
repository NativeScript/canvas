[package]
name = "canvas-napi"
version = "0.1.0"
edition = "2021"
publish = false
description = "Node-API binding for the canvas plugins: provides the same global.CanvasModule the V8 bindings install, for Node-API hosts (NativeScript Windows and Linux, Node)."

[lib]
crate-type = ["cdylib"]

[features]
default = ["napi8"]
napi8 = ["napi/napi8"]
# Hosts whose Node-API lacks type tags (NativeScript Windows on JavaScriptCore).
napi7 = ["napi/napi7"]

[dependencies]
napi = { version = "3.13.0", default-features = false, features = ["dyn-symbols"] }
napi-derive = "3.6.9"
canvas-c = { workspace = true, features = ["2d", "webgl", "gl"] }
canvas-core = { workspace = true, features = ["2d", "gl"] }
canvas-2d = { workspace = true, features = ["gl"] }
canvas-webgl.workspace = true
gl-bindings.workspace = true
parking_lot.workspace = true
log.workspace = true

# Windows renders 2D with Skia on Direct3D 12 (and WebGL on ANGLE, via `gl`).
[target.'cfg(target_os = "windows")'.dependencies]
canvas-core = { workspace = true, features = ["2d", "gl", "d3d"] }
canvas-c = { workspace = true, features = ["2d", "webgl", "gl", "d3d"] }
windows-core = "0.62"

# Linux shows frames in a GTK 4 (>= 4.6) widget, shared with GDK's GL context as EGLImages.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_6"] }
libloading = "0.8"

[build-dependencies]
napi-build = "2.5.0"
