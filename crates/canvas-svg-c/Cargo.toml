[package]
name = "canvas-svg-c"
version = "2.0.0"
edition = "2021"

[features]
default = []
gl = ["dep:canvas-core", "canvas-core/gl", "dep:gl-bindings", "dep:raw-window-handle", "skia-safe/gl"]
vulkan = ["dep:canvas-core", "canvas-core/vulkan", "skia-safe/vulkan"]
metal = [
    "dep:canvas-core",
    "canvas-core/mtl",
    "dep:objc2",
    "dep:objc2-metal",
    "dep:objc2-quartz-core",
    "skia-safe/metal",
]

[dependencies]
skia-safe = { workspace = true, features = ["svg", "textlayout"] }
canvas-svg = { workspace = true }
canvas-core = { workspace = true, optional = true }
gl-bindings = { workspace = true, optional = true }
raw-window-handle = { workspace = true, optional = true }
log = { workspace = true }

[target.'cfg(any(target_os = "ios", target_os = "macos", target_os = "tvos", target_os = "visionos"))'.dependencies]
objc2 = { workspace = true, optional = true }
objc2-metal = { workspace = true, optional = true }
objc2-quartz-core = { workspace = true, optional = true }
