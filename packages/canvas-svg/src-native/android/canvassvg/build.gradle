plugins {
	id 'com.android.library'
	id 'org.jetbrains.kotlin.android'
}

def NDK_PATH = ""
def hasNdkDirectory = project.hasProperty("ndkDirectory")
if (!hasNdkDirectory) {
	NDK_PATH = "$System.env.ANDROID_NDK"
	if (NDK_PATH == null || NDK_PATH == "null") {
		NDK_PATH = "$System.env.ANDROID_NDK_ROOT"
	}
	if (NDK_PATH == null || NDK_PATH == "null") {
		NDK_PATH = "$System.env.ANDROID_NDK_HOME"
	}
} else {
	NDK_PATH = ndkDirectory
}

android {
	namespace 'org.nativescript.canvas.svg'
	compileSdk 34

	defaultConfig {
		minSdk 21
		targetSdk 34

		testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
		consumerProguardFiles "consumer-rules.pro"

		externalNativeBuild {
			cmake {
				cppFlags "-std=c++20"
				arguments "-DANDROID_TOOLCHAIN=clang",
					"-DANDROID_STL=c++_static",
					"-DANDROID_NDK_ROOT=${NDK_PATH}",
					"-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
			}
		}
		ndk {
			def abis = (project.findProperty('canvasSvgAbis') ?: 'x86,x86_64,armeabi-v7a,arm64-v8a')
				.toString().split(',').collect { it.trim() }.findAll { it }
			abiFilters.clear()
			abiFilters.addAll(abis)
		}
	}

	buildTypes {
		release {
			minifyEnabled false
			proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
		}
	}
	// Linked at build time only; the app ships its own, and a bundled stale copy can win at boot.
	packagingOptions {
		jniLibs {
			excludes += '**/libNativeScript.so'
		}
	}

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_17
		targetCompatibility JavaVersion.VERSION_17
	}
	kotlinOptions {
		jvmTarget = '17'
	}

	externalNativeBuild {
		cmake {
			path "CMakeLists.txt"
		}
	}

	ndkVersion "29.0.14206865"
}

dependencies {

	implementation 'androidx.core:core-ktx:1.13.1'
	implementation 'androidx.appcompat:appcompat:1.7.0'
//    implementation 'com.google.android.material:material:1.11.0'
	testImplementation 'junit:junit:4.13.2'
	androidTestImplementation 'androidx.test.ext:junit:1.2.1'
	androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
