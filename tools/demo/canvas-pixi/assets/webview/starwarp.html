		<!--
  The control for "how fast is star-warp supposed to be on this phone".

  Same device, same GPU, same PixiJS build (dist/pixi.min.js is copied out of the
  very node_modules the NativeScript side bundles), same star count, same init
  options as DemoSharedCanvasPixi.starWarp. The only variable left is whose canvas
  implementation Pixi is talking to: the system WebView's, or ours.

  The numbers are painted into the page so a screencap reads them, and echoed to
  console so `adb logcat -s chromium` picks them up too.
-->
		<canvas id="c" style="width: 100vw; height: 100vh; display: block"></canvas>
		<div id="out" style="position: fixed; left: 0; right: 0; top: 0; color: #0f0; font: 15px monospace; background: rgba(0, 0, 0, 0.8); padding: 8px; white-space: pre"></div>
		<script src="./pixi.min.js"></script>

				var canvas = document.getElementById('c');

				function loadStar() {
					return new Promise(function (resolve, reject) {
						var img = new Image();
						img.onload = function () {
							resolve(PIXI.Texture.from(img));
						};
						img.onerror = function () {
							reject(new Error('star.png failed to decode'));
						};
						img.src = STAR_PNG;
					});
				}

				(async function () {
					var app = new PIXI.Application();
					var dpr = window.devicePixelRatio || 1;

					await app.init({
						canvas: canvas,
						preference: 'webgpu',
						width: canvas.clientWidth,
						height: canvas.clientHeight,
						autoDensity: true,
						resolution: dpr,
					});

					var src = app.renderer.texture && app.renderer.texture.source;
					say('renderer=' + (app.renderer.name || app.renderer.type) + ' dpr=' + dpr);
					say('pixel=' + (src && src.pixelWidth) + 'x' + (src && src.pixelHeight) + ' screen=' + app.renderer.screen.width + 'x' + app.renderer.screen.height + ' res=' + app.renderer.resolution);

					var starTexture = await loadStar();

					var starAmount = 5000;
					var cameraZ = 0;
					var fov = 20;
					var baseSpeed = 0.025;
					var speed = 0;
					var warpSpeed = 0;
					var starStretch = 5;
					var starBaseSize = 0.05;
					var stars = [];

					function randomizeStar(star, initial) {
						star.z = initial ? Math.random() * 2000 : cameraZ + Math.random() * 1000 + 2000;
						var deg = Math.random() * Math.PI * 2;
						var distance = Math.random() * 50 + 1;
						star.x = Math.cos(deg) * distance;
						star.y = Math.sin(deg) * distance;
					}

					for (var i = 0; i < starAmount; i++) {
						var star = { sprite: new PIXI.Sprite(starTexture), z: 0, x: 0, y: 0 };
						star.sprite.anchor.x = 0.5;
						star.sprite.anchor.y = 0.7;
						randomizeStar(star, true);
						app.stage.addChild(star.sprite);
						stars.push(star);
					}

					setInterval(function () {
						warpSpeed = warpSpeed > 0 ? 0 : 1;
					}, 5000);

					var frames = 0;
					var start = 0;
					var windows = 0;

					app.ticker.add(function (time) {
						speed += (warpSpeed - speed) / 20;
						cameraZ += time.deltaTime * 10 * (speed + baseSpeed);
						for (var i = 0; i < starAmount; i++) {
							var star = stars[i];
							if (star.z < cameraZ) randomizeStar(star);
							var z = star.z - cameraZ;
							star.sprite.x = star.x * (fov / z) * app.renderer.screen.width + app.renderer.screen.width / 2;
							star.sprite.y = star.y * (fov / z) * app.renderer.screen.width + app.renderer.screen.height / 2;
							var dxCenter = star.sprite.x - app.renderer.screen.width / 2;
							var dyCenter = star.sprite.y - app.renderer.screen.height / 2;
							var distanceCenter = Math.sqrt(dxCenter * dxCenter + dyCenter * dyCenter);
							var distanceScale = Math.max(0, (2000 - z) / 2000);
							star.sprite.scale.x = distanceScale * starBaseSize;
							star.sprite.scale.y = distanceScale * starBaseSize + (distanceScale * speed * starStretch * distanceCenter) / app.renderer.screen.width;
							star.sprite.rotation = Math.atan2(dyCenter, dxCenter) + Math.PI / 2;
						}

						// 10s windows: star-warp flips warpSpeed every 5s and the two phases cost
						// very different amounts of fill, so only a whole number of cycles gives a
						// number that means anything.
						var now = performance.now();
						if (!start) {
							start = now;
							return;
						}
						frames++;
						var elapsed = now - start;
						if (elapsed >= 10000) {
							if (windows++ < 4) say('fps=' + ((frames * 1000) / elapsed).toFixed(1));
							frames = 0;
							start = now;
						}
					});
				})();
			})();
